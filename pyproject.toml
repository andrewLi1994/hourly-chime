[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hourly-chime"
version = "1.0.0"
description = "Low-memory macOS hourly chime with pluggable AI reminder providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["edge-tts==7.2.8"]

[project.scripts]
chimectl = "hourly_chime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
